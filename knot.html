<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Knot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f4f5f7);
  --text:var(--tg-theme-text-color,#0f1419);--text2:var(--tg-theme-hint-color,#707579);
  --text3:color-mix(in srgb,var(--tg-theme-hint-color,#a0a5ad) 70%,transparent);
  --accent:var(--tg-theme-button-color,#2481cc);--accentText:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#2481cc);--border:var(--tg-theme-hint-color,#e4e6eb);
  --danger:#ff3b30;--success:#34c759;--bubble-them:var(--tg-theme-secondary-bg-color,#f0f2f5);
  --sh1:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --sh2:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh3:0 8px 24px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --sh4:0 16px 48px rgba(0,0,0,.18);
  --sT:env(safe-area-inset-top,0px);--sB:env(safe-area-inset-bottom,0px);
  --hH:56px;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--fs:15px;
  --appBg:radial-gradient(ellipse 80% 60% at 10% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 60%),
           radial-gradient(ellipse 60% 50% at 90% 100%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 60%),
           var(--tg-theme-bg-color,#fff);
}

/* ═══ THEMES ═══ */
html[data-theme="oled"]{--bg:#000;--bg2:#0a0a0a;--border:#1a1a1a;--text:#f5f5f5;--text2:#8a8a8a;--text3:#5a5a5a;--bubble-them:#161616;--appBg:#000}
html[data-theme="ocean"]{--bg:#0b1e2d;--bg2:#12293d;--text:#e6f1f8;--text2:#7c95a8;--border:#1c3a52;--accent:#38bdf8;--accentText:#001a2b;--link:#38bdf8;--bubble-them:#162c40;--appBg:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(56,189,248,.15),transparent 60%),#0b1e2d}
html[data-theme="sunset"]{--bg:#1a0f1e;--bg2:#2a1a2e;--text:#fce7f3;--text2:#b78eb5;--border:#3d2444;--accent:#fb7185;--accentText:#1a0f1e;--link:#fb7185;--bubble-them:#32192f;--appBg:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(251,113,133,.15),transparent 60%),#1a0f1e}
html[data-theme="forest"]{--bg:#0d1710;--bg2:#182a1d;--text:#dcfce7;--text2:#7dab87;--border:#1e3826;--accent:#4ade80;--accentText:#051509;--link:#4ade80;--bubble-them:#1c3323;--appBg:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(74,222,128,.15),transparent 60%),#0d1710}
html[data-theme="neon"]{--bg:#0a0614;--bg2:#15082a;--text:#e9d5ff;--text2:#a78bfa;--border:#2a1157;--accent:#c084fc;--accentText:#0a0614;--link:#c084fc;--bubble-them:#1c0d3a;--appBg:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(192,132,252,.15),transparent 60%),#0a0614}
html[data-theme="mono"]{--bg:#111;--bg2:#1a1a1a;--text:#eee;--text2:#888;--border:#2a2a2a;--accent:#ddd;--accentText:#111;--link:#ddd;--bubble-them:#1e1e1e;--appBg:#111}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,sans-serif;color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;background:var(--appBg);background-attachment:fixed}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--sT);position:relative}

/* ═══ HEADER (glass) ═══ */
#header{height:var(--hH);padding:0 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:50;position:relative;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
#header .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7cc4ff));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--accentText);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent);position:relative;overflow:hidden}
#header .logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:shine 4s infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#header .title{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
#header .subtitle{font-size:12px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:4px;line-height:1.2}
#header .back,#header .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--link);flex-shrink:0;transition:background .15s,transform .15s}
#header .back svg,#header .icon-btn svg{width:22px;height:22px;fill:currentColor}
@media(hover:hover){#header .back:hover,#header .icon-btn:hover{background:var(--bg2)}}
#header .back:active,#header .icon-btn:active{background:var(--bg2);transform:scale(.92)}
#header .right{margin-left:auto;display:flex;align-items:center;gap:2px}

#view{flex:1;overflow-y:auto;padding:8px 8px 12px;-webkit-overflow-scrolling:touch;position:relative;scroll-behavior:smooth;z-index:1}
#view.no-padding{padding:0}
#view.enter>*{animation:viewIn .28s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ TABS (glass) ═══ */
#tabs{display:flex;flex-shrink:0;padding-bottom:var(--sB);position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.tabRipple{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 30%,transparent);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:tabRip .6s var(--ease)}
@keyframes tabRip{50%{transform:translate(-50%,-50%) scale(1);opacity:.6}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.tab{flex:1;padding:8px 4px 12px;color:var(--text3);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s;overflow:hidden}
.tab .icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .28s var(--spring)}
.tab .icon svg{width:24px;height:24px;fill:currentColor}
.tab.active{color:var(--accent);font-weight:600}
.tab.active .icon{transform:translateY(-1px) scale(1.08)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--danger);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg);animation:pop .25s var(--spring)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%{background-position:-300% 0}100%{background-position:300% 0}}
@keyframes typeDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
@keyframes loaderGrow{0%{width:0}40%{width:55%}70%{width:82%}100%{width:92%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}70%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
@keyframes heartUp{0%{transform:scale(.3) translateY(0);opacity:1}60%{transform:scale(1.3) translateY(-60px);opacity:1}100%{transform:scale(.9) translateY(-110px);opacity:0}}
@keyframes particle{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes checkBlink{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes auroraMove{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,80px) scale(.95)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes sendPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes gradSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}

#topLoader{position:fixed;top:0;left:0;height:2.5px;width:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7cc4ff));z-index:9999;transition:width .3s var(--ease),opacity .2s;border-radius:0 4px 4px 0;box-shadow:0 0 8px var(--accent)}
#topLoader.active{animation:loaderGrow 1.4s infinite var(--ease)}
#topLoader.finish{width:100%!important;animation:none;opacity:0}

.rp{position:relative;overflow:hidden}
.rp .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .55s var(--ease);pointer-events:none}
.rp .rip.dark{background:rgba(0,0,0,.1)}

/* ═══ ROWS ═══ */
.row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:2px;transition:background .12s,transform .12s;position:relative;overflow:hidden;animation:fadeUp .25s var(--ease)}
@media(hover:hover){.row:hover{background:var(--bg2);transform:translateX(2px)}}
.row:active{background:var(--bg2)}
.row.pinned{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;color:#fff;flex-shrink:0;background-size:cover;background-position:center;position:relative;letter-spacing:-.02em;box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:hidden}
.avatarAnim{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,#fff 25%,transparent),transparent);animation:gradSpin 8s linear infinite;z-index:0;opacity:.5}
.avatar>span{position:relative;z-index:1}
.avatar::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -2px 6px rgba(0,0,0,.08),inset 0 1px 2px rgba(255,255,255,.15);pointer-events:none}
.avatar.online::before{content:'';position:absolute;bottom:1px;right:1px;width:13px;height:13px;background:var(--success);border:2.5px solid var(--bg);border-radius:50%;z-index:3;animation:onlinePulse 2.5s infinite}
.rowBody{flex:1;min-width:0}
.rowTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.rowName{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;letter-spacing:-.01em}
.ver{color:#1da1f2;font-size:12px;font-weight:700}
.pin{font-size:11px;opacity:.55}
.rowTime{font-size:11px;color:var(--text3);flex-shrink:0;font-weight:500}
.rowBottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rowLast{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;line-height:1.35}
.rowBadge{background:var(--accent);color:var(--accentText);border-radius:999px;min-width:22px;height:22px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;animation:pop .25s var(--spring);box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 40%,transparent)}
.rowStatus{font-size:12px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:4px;line-height:1.3}
.rowStatus.online{color:var(--success);font-weight:500}
.rowStatus.typing{color:var(--accent);font-style:italic;font-weight:500}
.oDot{display:inline-block;width:7px;height:7px;background:var(--success);border-radius:50%;margin-right:4px}
.tdots{display:inline-flex;gap:2px;margin-left:2px}
.tdots span{width:4px;height:4px;background:var(--accent);border-radius:50%;animation:typeDot 1.2s infinite}
.tdots span:nth-child(2){animation-delay:.15s}.tdots span:nth-child(3){animation-delay:.3s}

.sk{background:linear-gradient(90deg,var(--bg2) 0%,color-mix(in srgb,var(--text3) 20%,var(--bg2)) 50%,var(--bg2) 100%);background-size:300% 100%;animation:shimmer 1.8s linear infinite;border-radius:12px}
.skRow{display:flex;gap:12px;padding:12px;align-items:center;margin-bottom:2px}
.skCircle{width:52px;height:52px;border-radius:50%;flex-shrink:0}
.skLine{height:12px;border-radius:6px}

/* ═══ CHAT ═══ */
#chatWrap{display:flex;flex-direction:column;height:calc(100vh - var(--hH) - var(--sT));height:calc(100dvh - var(--hH) - var(--sT));position:relative}
#messages{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#messages.wp-dots{background-image:radial-gradient(circle,color-mix(in srgb,var(--text3) 18%,transparent) 1px,transparent 1px);background-size:20px 20px}
#messages.wp-gb{background:linear-gradient(135deg,#e0e7ff,#f0f9ff 50%,#fef3c7)}
#messages.wp-gp{background:linear-gradient(135deg,#f3e7ff,#ffe0f0 50%,#fff7e0)}
#messages.wp-gg{background:linear-gradient(135deg,#dcfce7,#ecfdf5 50%,#f0fdfa)}
#messages.wp-stars{background-color:#0a0e27;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 60px 70px,#fff,transparent),radial-gradient(1px 1px at 50px 160px,#fff,transparent);background-size:200px 200px}
#messages.wp-hearts{background-color:#fff0f5;background-image:radial-gradient(circle at 30% 40%,rgba(255,182,193,.4),transparent 20%),radial-gradient(circle at 70% 60%,rgba(255,105,180,.3),transparent 25%)}
#messages.wp-dark{background:#1a1a2e}

.msg{max-width:80%;padding:8px 12px 6px;border-radius:18px;font-size:var(--fs);line-height:1.38;word-wrap:break-word;white-space:pre-wrap;position:relative;animation:msgIn .25s var(--spring);box-shadow:var(--sh1);transition:box-shadow .15s,transform .15s}
.msg.mine{align-self:flex-end;color:var(--accentText);border-bottom-right-radius:6px;--tc:var(--accent);
  background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 75%,#7cc4ff) 100%)}
.msg.them{align-self:flex-start;background:var(--bubble-them);color:var(--text);border-bottom-left-radius:6px;--tc:var(--bubble-them)}
.msg+.msg{margin-top:1px}
.msg.grouped{margin-top:0}
.msg.grouped .msgTail{display:none}
.msg.grouped .msgTime{display:none}
.msg.grouped .msgSender{display:none}
@media(hover:hover){.msg:hover{box-shadow:var(--sh2)}}
.msgTail{position:absolute;bottom:0;width:12px;height:12px;background:var(--tc);-webkit-mask:radial-gradient(circle at 0 0,transparent 11px,#000 12px);mask:radial-gradient(circle at 0 0,transparent 11px,#000 12px)}
.msg.mine .msgTail{right:-7px;transform:scaleX(-1);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 87%,#7cc4ff),var(--accent))}
.msg.them .msgTail{left:-7px}
.msg.sending{opacity:.55}
.msgTime{font-size:10px;opacity:.7;margin-top:3px;text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:3px;line-height:1;font-weight:500}
.msg.mine .msgTime{color:rgba(255,255,255,.85)}
.msgStatus{font-size:10px;font-weight:700}
.msgStatus.read{color:#7ad0ff;animation:checkBlink .5s var(--ease)}
.msgEdited,.msgEnc{font-size:10px;opacity:.72}
.msgPhoto{max-width:100%;border-radius:12px;display:block;margin-bottom:4px;cursor:pointer;transition:transform .2s}
.msgPhoto:active{transform:scale(.98)}
.msgReply{font-size:12px;opacity:.92;border-left:3px solid currentColor;padding:5px 8px;margin-bottom:6px;background:rgba(0,0,0,.07);border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;cursor:pointer}
.msg.mine .msgReply{background:rgba(255,255,255,.16)}
.ogCard{margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06);cursor:pointer;transition:transform .15s}
.msg.mine .ogCard{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.12)}
.ogCard:active{transform:scale(.98)}
.ogHost{font-size:11px;font-weight:700;opacity:.85;margin-bottom:2px}
.ogUrl{font-size:12px;opacity:.75;word-break:break-all;line-height:1.3}
.msgText a{color:inherit;text-decoration:underline}
.msg.mine .msgText a{color:rgba(255,255,255,.95)}
.highlight{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:3px;padding:0 2px}
.locCard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.07);margin-top:4px;cursor:pointer}
.msg.mine .locCard{background:rgba(255,255,255,.18)}
.locCard .locIco{font-size:28px}
.locCard .locTxt{font-size:13px;line-height:1.3}
.locCard .locSub{font-size:11px;opacity:.7}
.msgRx{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.msgR{background:rgba(0,0,0,.08);border-radius:999px;padding:2px 8px;font-size:12px;display:flex;gap:3px;align-items:center;animation:pop .25s var(--spring);cursor:pointer;font-weight:500;transition:transform .15s}
.msgR:active{transform:scale(1.15)}
.msg.mine .msgR{background:rgba(255,255,255,.2)}
.msgR.mine{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.msg.mine .msgR.mine{background:rgba(255,255,255,.4)}
.msgSender{font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}

.stickerMsg{font-size:72px;line-height:1;padding:10px 14px;animation:pop .3s var(--spring);text-align:center}
.msg:has(.stickerMsg){background:transparent!important;box-shadow:none;padding:0}
.msg:has(.stickerMsg) .msgTail{display:none}
.msg:has(.stickerMsg) .msgTime{color:var(--text2)!important;background:rgba(0,0,0,.08);border-radius:999px;padding:2px 8px;margin-top:4px;display:inline-flex}

.vidNote{width:180px;height:180px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;box-shadow:var(--sh2);transition:transform .2s}
.vidNote:active{transform:scale(.97)}
.vidNote video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vidNote .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);opacity:1;transition:opacity .25s;color:#fff;font-size:40px}
.vidNote.playing .ov{opacity:0}

.wave{display:flex;align-items:center;gap:10px;padding:6px 0}
.wave .pbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:transform .15s}
.msg.them .wave .pbtn{background:rgba(0,0,0,.08)}
.wave .pbtn:active{transform:scale(.9)}
.wave .bars{display:flex;gap:2px;align-items:center;height:24px;flex:1;max-width:160px}
.wave .bars span{width:2px;background:currentColor;opacity:.5;border-radius:1px;transition:opacity .1s}
.wave .bars span.played{opacity:1}
.wave .dur{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;font-weight:500}

.dateSep{align-self:center;background:rgba(0,0,0,.42);color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;margin:12px 0 8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadeIn .25s;position:sticky;top:4px;z-index:5;letter-spacing:.02em}

.readMarker{align-self:flex-end;font-size:11px;color:var(--accent);padding:2px 8px;margin-top:2px;font-weight:500;animation:fadeIn .3s;display:flex;align-items:center;gap:4px}

function dateLabel(iso) { const d = parseDate(iso), n = new Date(); const t = new Date(n.getFullYear(),n.getMonth(),n.getDate()), tg2 = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const diff = (t-tg2)/86400000; if (diff===0) return 'Сегодня'; if (diff===1) return 'Вчера'; if (diff<7) return ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]; const m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']; if (d.getFullYear() === n.getFullYear()) return d.getDate()+' '+m[d.getMonth()]; return d.getDate()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getFullYear(); }

async function getKey(otherId) { const a = Math.min(meUser.id, otherId), b = Math.max(meUser.id, otherId); const ck = a+':'+b; if (keyCache[ck]) return keyCache[ck]; const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('knot-v1-chat:'+a+':'+b)); const k = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']); keyCache[ck] = k; return k; }
async function encryptText(text, otherId) { if (!text) return text; try { const k = await getKey(otherId); const iv = crypto.getRandomValues(new Uint8Array(12)); const c = await crypto.subtle.encrypt({name:'AES-GCM',iv}, k, new TextEncoder().encode(text)); const comb = new Uint8Array(iv.length + c.byteLength); comb.set(iv, 0); comb.set(new Uint8Array(c), iv.length); let bin = ''; for (let i = 0; i < comb.length; i++) bin += String.fromCharCode(comb[i]); return ENC_PREFIX + btoa(bin); } catch(e){ return text; } }

function isSameGroup(m1, m2) {
  if (!m1 || !m2) return false;
  if (m1.from_user_id !== m2.from_user_id) return false;
  const t1 = parseDate(m1.created_at).getTime();
  const t2 = parseDate(m2.created_at).getTime();
  return Math.abs(t1 - t2) < 5 * 60 * 1000;
}

function renderMessages(messages) {
  const box = $('messages');
  if (!box) return;
  let lastDay = '', html = '';
  let prev = null;
  const lastMineIdx = (() => {
    for (let i = messages.length - 1; i >= 0; i--) if (messages[i].is_mine) return i;
    return -1;
  })();

  messages.forEach((m, i) => {
    const dk = dayKey(m.created_at);
    if (dk !== lastDay) {
      html += `<div class="dateSep">${dateLabel(m.created_at)}</div>`;
      lastDay = dk;
      prev = null;
    }
    const grouped = prev && isSameGroup(prev, m) && !m.is_sticker;
    html += msgHtml(m, grouped);
    prev = m;
    if (m.id === lastMineIdx || (i === lastMineIdx && m.is_mine && m.is_read)) {
      html += `<div class="readMarker">✓✓ Прочитано</div>`;
    }
  });

  if (!html) html = '<div class="empty" style="padding:40px"><div class="t">Пока пусто</div><div class="d">Напиши первым 👋</div></div>';
  box.innerHTML = html;
  attachMsgHandlers();
}

function msgHtml(m, grouped = false) {
  const check = m.is_mine ? `<span class="msgStatus ${m.is_read?'read':''}" data-status="${m.id}">${m.is_read?'✓✓':'✓'}</span>` : '';
  const edit = m.edited ? '<span class="msgEdited">изм.</span>' : '';
  const enc = m.encrypted ? '<span class="msgEnc">🔒</span>' : '';
  const photo = m.photo_url ? `<img class="msgPhoto" src="${m.photo_url}" onclick="openPhoto('${m.photo_url}')" alt="">` : '';
  const voice = m.voice_url ? waveHtml(m.voice_url, String(m.id)) : '';
  const video = m.video_url ? `<div class="vidNote" onclick="playNote(this)"><video src="${m.video_url}" playsinline loop preload="metadata"></video><div class="ov">▶</div></div>` : '';
  const sticker = m.is_sticker ? `<div class="stickerMsg">${esc(m.text)}</div>` : '';
  const reply = m.reply_to ? `<div class="msgReply" onclick="event.stopPropagation();scrollToMsg(${m.reply_to})">↩ ${esc(m.reply_to_text||'сообщение')}</div>` : '';
  const rxs = (m.reactions||[]).map(r => `<span class="msgR ${r.mine?'mine':''}" onclick="quickReact(${m.id},'${r.emoji}')">${r.emoji}${r.count>1?' '+r.count:''}</span>`).join('');
  const rxHtml = rxs ? `<div class="msgRx">${rxs}</div>` : '';
  let text = '';
  if (!m.is_sticker && m.text) {
    const urls = extractUrls(m.text);
    let body = linkify(m.text);
    if (urls.length && !m.photo_url && !m.voice_url && !m.video_url) {
      const u = urls[0];
      let host = '';
      try { host = new URL(u).hostname.replace(/^www\./,''); } catch(e){ host = u; }
      body += `<div class="ogCard" onclick="event.stopPropagation();window.open('${esc(u)}','_blank')"><div class="ogHost">${esc(host)}</div><div class="ogUrl">${esc(u.slice(0,80))}${u.length>80?'…':''}</div></div>`;
    }
    text = `<div class="msgText">${body}</div>`;
  }
  const tail = (m.is_sticker || grouped) ? '' : '<div class="msgTail"></div>';
  const sender = (!m.is_mine && m.sender_name && !m.is_sticker && !grouped) ? `<div class="msgSender" style="color:${SENDER_COLORS[m.from_user_id % SENDER_COLORS.length]}">${esc(m.sender_name)}</div>` : '';
  const grpCls = grouped ? ' grouped' : '';
  return `<div class="msg ${m.is_mine?'mine':'them'}${grpCls}" data-id="${m.id}" data-mine="${m.is_mine?'1':'0'}">${tail}${sender}${reply}${photo}${voice}${video}${sticker}${text}${rxHtml}<div class="msgTime">${enc}${edit}${timeMsg(m.created_at)}${check}</div></div>`;
}

function waveHtml(url, id) {
  const bars = 24;
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = ((seed << 5) - seed) + id.charCodeAt(i);
  seed = Math.abs(seed);
  let b = '';
  for (let i = 0; i < bars; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    b += `<span style="height:${6 + (seed / 233280) * 18}px"></span>`;
  }
  return `<div class="wave"><button class="pbtn" onclick="toggleWave(this)">▶</button><div class="bars">${b}</div><span class="dur">0:00</span><audio preload="metadata" src="${url}" style="display:none"></audio></div>`;
}

function toggleWave(btn) {
  const w = btn.closest('.wave');
  const a = w.querySelector('audio');
  const bars = w.querySelectorAll('.bars span');
  const dur = w.querySelector('.dur');
  if (a.paused) {
    document.querySelectorAll('.wave audio').forEach(x => { if (x !== a && !x.paused) { x.pause(); x.currentTime = 0; } });
    a.play(); btn.textContent = '❚❚';
    a.ontimeupdate = () => {
      const p = a.currentTime / (a.duration || 1);
      const pl = Math.floor(p * bars.length);
      bars.forEach((b, i) => b.classList.toggle('played', i < pl));
      dur.textContent = fmtDur(a.currentTime);
    };
    a.onloadedmetadata = () => dur.textContent = fmtDur(a.duration);
    a.onended = () => { btn.textContent = '▶'; bars.forEach(b => b.classList.remove('played')); dur.textContent = fmtDur(a.duration); };
  } else { a.pause(); btn.textContent = '▶'; }
}

function playNote(el) {
  const v = el.querySelector('video');
  if (!v) return;
  if (v.paused) { v.muted = false; v.play(); el.classList.add('playing'); haptic('light'); }
  else { v.pause(); v.currentTime = 0; el.classList.remove('playing'); }
}

function attachMsgHandlers() {
  document.querySelectorAll('.msg').forEach(el => {
    if (el.dataset.h === '1') return;
    el.dataset.h = '1';
    let lt = null, lastTap = 0, touchStartX = 0, touchStartY = 0, swiping = false;

    el.addEventListener('click', e => {
      if (e.target.closest('.msgR') || e.target.tagName === 'AUDIO' || e.target.tagName === 'IMG' || e.target.closest('.wave') || e.target.closest('.vidNote') || e.target.closest('.msgReply')) return;
      const n = Date.now();
      if (n - lastTap < 300) {
        lastTap = 0;
        const id = parseInt(el.dataset.id);
        if (!isNaN(id)) {
          const r = el.getBoundingClientRect();
          spawnHeartBurst(r.left + r.width / 2, r.top + r.height / 2);
          quickReact(id, '❤️');
        }
      } else lastTap = n;
    });

    const start = e => {
      if (e.touches) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
      lt = setTimeout(() => { haptic('medium'); showPicker(el); }, 550);
    };
    const move = e => {
      if (!e.touches) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (Math.abs(dx) > 10 && dy < 30) { clearTimeout(lt); swiping = true; el.style.transform = `translateX(${dx * 0.5}px)`; }
    };
    const end = () => {
      clearTimeout(lt);
      if (swiping) {
        const t = el.style.transform;
        const match = t.match(/translateX\((-?\d+)/);
        const dx = match ? parseInt(match[1]) : 0;
        el.style.transform = '';
        if (dx > 30 && el.dataset.mine === '0') startReply(parseInt(el.dataset.id));
        swiping = false;
      }
    };
    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchmove', move, {passive:true});
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
}

async function forwardMsg(id, el) {

async function sendMessage() {
  const input = $('msgInput'), btn = $('sendBtn');
  if (!input || !currentChat) return;
  const plain = input.value.trim();
  const ph = pendingPhotoUrl, vc = pendingVoiceUrl, rid = replyToId;
  if (!plain && !ph && !vc) return;

  const tid = 'tmp' + Date.now();
  const fake = {id:tid, text:plain, photo_url:ph, voice_url:vc, reply_to:rid,
    reply_to_text: rid ? replyToText(rid) : null,
    created_at: new Date().toISOString().replace('T',' ').slice(0,19),
    is_mine:true, is_read:false, reactions:[], encrypted:!!plain};
  await appendMsgs([fake], false);
  document.querySelector(`.msg[data-id="${tid}"]`)?.classList.add('sending');

  input.value = ''; input.style.height = 'auto';
  btn.disabled = true;
  setDraft(currentChat, '');
  clearReply(); clearPendingPhoto(); clearPendingVoice(); hideEmoji();
  playSound('sent'); haptic('light');

  const enc = plain ? await encryptText(plain, currentChat) : '';
  try {
    const {message} = await api(`/api/messages/${currentChat}`, {method:'POST', body:JSON.stringify({text:enc, photo_url:ph, voice_url:vc, reply_to:rid})});
    message.text = plain; message.encrypted = !!plain;
    const el = document.querySelector(`.msg[data-id="${tid}"]`);
    if (el) { const w = document.createElement('div'); w.innerHTML = msgHtml(message).trim(); el.replaceWith(w.firstChild); }
    const b = $('messages'); if (b) b.dataset.last = message.id;
    attachMsgHandlers();
    if (!firstMessageShown) {
      firstMessageShown = true;
      localStorage.setItem('knot_first_msg','1');
      setTimeout(spawnConfetti, 300);
    }
    if (plain.trim().toLowerCase() === 'knot') {
      setTimeout(() => { spawnConfetti(); toast('🪢 Knot!'); haptic('success'); }, 400);
    }
  } catch(e){ alert(e.message); }
  input.disabled = false;
  btn.disabled = !input.value.trim() && !pendingPhotoUrl && !pendingVoiceUrl;
  input.focus();
}

async function appendMsgs(msgs, dec = true) {
  const box = $('messages'); if (!box) return;
  box.querySelector('.empty')?.remove();
  let html = '', lastDay = '';
  const all = box.querySelectorAll('.msg');
  if (all.length) lastDay = all[all.length-1].getAttribute('data-d') || '';
  for (const m of msgs) {
    if (dec && (currentChat || currentGroup)) {
      const d = await decryptText(m.text, currentChat || currentGroup);
      m.text = d.text; m.encrypted = d.encrypted;
    }
    const dk = dayKey(m.created_at);
    if (dk !== lastDay) { html += `<div class="dateSep">${dateLabel(m.created_at)}</div>`; lastDay = dk; }
    html += msgHtml(m);
  }
  const wasBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
  const w = document.createElement('div'); w.innerHTML = html;
  while (w.firstChild) box.appendChild(w.firstChild);
  if (msgs.length) {
    const last = msgs[msgs.length-1];
    if (typeof last.id === 'number') box.dataset.last = last.id;
    box.querySelector('.msg:last-child')?.setAttribute('data-d', dayKey(last.created_at));
  }
  attachMsgHandlers();
  if (wasBottom) scrollBottom();
  else { const u = $('upill'); if (u) { u.textContent = (parseInt(u.textContent)||0) + msgs.length; u.style.display = 'flex'; } }
}

async function toggleRec() {
  if (mediaRecorder && mediaRecorder.state === 'recording') { stopRec(); return; }
  await startRec();
}
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recChunks = [];
    const o = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? {mimeType:'audio/webm;codecs=opus'} : {};
    mediaRecorder = new MediaRecorder(stream, o);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadVoice(); };
    mediaRecorder.start();
    recStart = Date.now();
    $('micBtn').classList.add('rec');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    audioAnalyser = audioCtx.createAnalyser();
    audioAnalyser.fftSize = 64;
    source.connect(audioAnalyser);
    audioData = new Uint8Array(audioAnalyser.frequencyBinCount);

    const bar = document.createElement('div');
    bar.className = 'recBar'; bar.id = 'recBar';
    bar.innerHTML = `<span class="time" id="recTime">0:00</span><div class="liveWave" id="liveWave">${Array(20).fill(0).map(() => '<span></span>').join('')}</div><button class="cnl" onclick="cancelRec()">Отмена</button>`;
    $('chatWrap').insertBefore(bar, $('inputBar'));

    recTimer = setInterval(() => {
      const el = $('recTime'); if (!el) return;
      const s = Math.floor((Date.now() - recStart) / 1000);
      el.textContent = Math.floor(s/60) + ':' + (s%60).toString().padStart(2,'0');
      if (s >= 60) stopRec();
    }, 200);

    liveWaveTimer = setInterval(() => {
      if (!audioAnalyser) return;
      audioAnalyser.getByteFrequencyData(audioData);
      const bars = document.querySelectorAll('#liveWave span');
      bars.forEach((b, i) => {
        const v = audioData[i * 2] || 0;
        const h = Math.max(4, (v / 255) * 28);
        b.style.height = h + 'px';
      });
    }, 60);

    haptic('medium');
  } catch(e){ alert('Нет доступа к микрофону'); }
}
function stopRec() { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); cleanupRec(); haptic('light'); }
function cancelRec() {
  if (mediaRecorder?.state === 'recording') {
    recChunks = [];
    const s = mediaRecorder.stream;
    mediaRecorder.onstop = () => s?.getTracks().forEach(t => t.stop());
    mediaRecorder.stop();
  }
  cleanupRec(); haptic('light');
}
function cleanupRec() {
  $('micBtn')?.classList.remove('rec');
  $('recBar')?.remove();
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (liveWaveTimer) { clearInterval(liveWaveTimer); liveWaveTimer = null; }
  audioAnalyser = null; audioData = null;
}
async function uploadVoice() {

  if (ex) { ex.remove(); return; }

  w.insertBefore(s, w.firstChild);

function doSearch(q) {
  const box = $('messages'); if (!box) return;
  box.querySelectorAll('.searchResult').forEach(el => el.remove());
  // clear previous highlights
  box.querySelectorAll('.msgText').forEach(t => {
    if (t.dataset.orig) { t.innerHTML = t.dataset.orig; delete t.dataset.orig; }
  });
  if (q.length < 2) return;
  const msgs = box.querySelectorAll('.msg');
  const found = [];
  const qLow = q.toLowerCase();
  msgs.forEach(el => {
    const te = el.querySelector('.msgText');
    if (!te) return;
    const t = te.textContent || '';
    if (t.toLowerCase().includes(qLow)) {
      found.push({el, t});
      if (!te.dataset.orig) te.dataset.orig = te.innerHTML;
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      te.innerHTML = esc(t).replace(re, '<span class="highlight">$1</span>');
    }
  });
  if (!found.length) return;
  const h = document.createElement('div');
  h.innerHTML = `<div class="searchResult" style="opacity:.7"><div class="sName">Найдено: ${found.length}</div></div>`;
  found.slice(0, 20).forEach(({el, t}) => {
    const i = document.createElement('div');
    i.className = 'searchResult';
    const idx = t.toLowerCase().indexOf(qLow);
    const snippet = (idx > 20 ? '…' : '') + t.slice(Math.max(0, idx-20), idx+q.length+40) + (idx+q.length+40 < t.length ? '…' : '');
    i.innerHTML = `<div class="sText">${esc(snippet).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<span class="highlight">$1</span>')}</div>`;
    i.onclick = () => {
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.style.background = 'color-mix(in srgb,var(--accent) 30%,transparent)';
      setTimeout(() => el.style.background = '', 1500);
    };
    h.appendChild(i);
  });
  box.insertBefore(h, box.firstChild);
}

async function openGroup(gid, keepScreen = false) {
  view().classList.add('no-padding');
  if (!keepScreen) view().innerHTML = '<div class="empty"><div class="d">Загрузка…</div></div>';
  setTabsVisible(false);
  currentGroup = gid; currentChat = null; currentChatUser = null;
  stopPolling();
  try {
    const [{group, members}, {messages}] = await Promise.all([
      api(`/api/groups/${gid}`),
      api(`/api/groups/${gid}/messages`),
    ]);
    for (const m of messages) {
      const d = await decryptText(m.text, gid);
      m.text = d.text; m.encrypted = d.encrypted;
    }
    renderGroupScreen(group, members, messages);
    startGroupPoll(gid);
  } catch(e){ view().innerHTML = `<div class="empty"><div class="d">${esc(e.message)}</div></div>`; }
}

function renderGroupScreen(group, members, messages) {
  setHeaderChat({
    title: '👥 ' + esc(group.name),
    sub: members.length + ' участников',
    onClick: () => showGroupInfo(group.id),

  });

        <button class="rbtn" id="sendBtn" disabled>➤</button>
      </div>
    </div>`;
  renderMessages(messages);
  $('grInfoBtn').onclick = () => showGroupInfo(group.id);
  const input = $('msgInput'), btn = $('sendBtn');
  input.addEventListener('input', () => {
    btn.disabled = !input.value.trim() && !pendingPhotoUrl && !pendingVoiceUrl;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!btn.disabled) sendGroupMsg(); }
  });
  btn.onclick = sendGroupMsg;
  $('attachBtn').onclick = showAttachMenu;
  $('emojiBtn').onclick = toggleEmoji;
  $('scrollBtn').onclick = scrollBottom;
  [btn, $('attachBtn'), $('emojiBtn')].forEach(attachRipple);
  $('messages').addEventListener('scroll', onChatScroll);
  scrollBottom();
}

async function sendGroupMsg() {
  const input = $('msgInput'), btn = $('sendBtn');
  if (!input || !currentGroup) return;
  const plain = input.value.trim();
  const ph = pendingPhotoUrl, vc = pendingVoiceUrl;
  if (!plain && !ph && !vc) return;
  input.value = ''; btn.disabled = true;
  clearPendingPhoto(); clearPendingVoice(); hideEmoji();
  const enc = plain ? await encryptText(plain, currentGroup) : '';
  try {
    const {message} = await api(`/api/groups/${currentGroup}/messages`, {method:'POST', body:JSON.stringify({text:enc, photo_url:ph, voice_url:vc})});
    message.text = plain; message.encrypted = !!plain;
    message.sender_name = (meUser.first_name||'') + ' ' + (meUser.last_name||'');
    await appendMsgs([message], false);
    playSound('sent');
  } catch(e){ alert(e.message); }
  input.disabled = false; input.focus();
}

function startGroupPoll(gid) {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (currentGroup !== gid) return;
    try {
      const box = $('messages'); if (!box) return;
      const after = box.dataset.last || '0';
      const {messages} = await api(`/api/groups/${gid}/new?after=${after}`, {silent:true});
      for (const m of messages) {
        const d = await decryptText(m.text, gid);
        m.text = d.text; m.encrypted = d.encrypted;
        await appendMsgs([m], false);
        playSound('received');
      }
    } catch(e){}
  }, 2500);
}

    bd.style.cssText = 'padding:0;align-items:stretch;justify-content:flex-start';
    bd.onclick = e => { if (e.target === bd) bd.remove(); };
    bd.innerHTML = `<div class="fullSheet"><div class="sheetTitle">👥 ${esc(group.name)}<button class="sheetClose" onclick="this.closest('.backdrop').remove()">✕</button></div><div style="font-size:13px;color:var(--text2);margin-bottom:8px">Участники (${members.length}/10)</div>${members.map(m => `<div class="memberPick">${avatarHtml(m)}<div class="mname">${esc(m.first_name)} ${esc(m.last_name||'')}</div></div>`).join('')}<button class="btnPrimary btnDanger" style="margin-top:14px" onclick="leaveGrp(${gid})">Покинуть группу</button></div>`;
    document.body.appendChild(bd);
  } catch(e){ alert(e.message); }
}
async function leaveGrp(gid) {
  if (!confirm('Выйти из группы?')) return;
  await api(`/api/groups/${gid}/leave`, {method:'POST'});
  document.querySelectorAll('.backdrop').forEach(m => m.remove());
  haptic('success');
  switchTab('chats');
}

async function updateBadge() {
  try {
    const {user} = await api('/api/me', {silent:true});
    meUser = user;
    const n = user.unread || 0;
    const b = $('tabBadge');
    if (!b) return;
    if (n > 0) { b.textContent = n > 99 ? '99+' : n; b.style.display = 'flex'; }
    else b.style.display = 'none';
  } catch(e){}
}
setInterval(updateBadge, 5000);


// Hotkeys
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.reactPicker,.backdrop,.attachMenu,.chatMenu,.emojiPanel,.chatSearch').forEach(el => el.remove());
    clearReply();
    hideEmoji();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (currentChat || currentGroup) toggleSearch();
    else switchTab('people');
    return;
  }
  if (e.key === 'ArrowUp' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    const inp = $('msgInput');
    if (inp && document.activeElement === inp && !inp.value.trim()) {
      e.preventDefault();
      const own = [...document.querySelectorAll('.msg[data-mine="1"]')].pop();
      if (own) editMsg(parseInt(own.dataset.id));
    }
  }
});

// Drag-n-drop files into chat
document.addEventListener('dragover', e => {
  if (!currentChat && !currentGroup) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
document.addEventListener('drop', e => {
  if (!currentChat && !currentGroup) return;
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (!files || !files.length) return;
  const f = files[0];
  if (f.type.startsWith('image/')) {
    const fd = new FormData(); fd.append('photo', f);
    api('/api/upload', {method:'POST', body:fd}).then(({photo_url}) => {
      pendingPhotoUrl = photo_url;
      if ($('photoPrevImg')) { $('photoPrevImg').src = photo_url; $('photoPrev').style.display = 'flex'; }
      if ($('sendBtn')) $('sendBtn').disabled = false;
      toast('📷 Фото готово');
      haptic('success');
    }).catch(err => alert(err.message));
  } else {
    toast('📎 ' + f.name);
    const inp = $('msgInput');
    if (inp) { inp.value = (inp.value ? inp.value + ' ' : '') + '📎 ' + f.name; inp.dispatchEvent(new Event('input')); }
  }
});

// Pinch-zoom text (simple: double-tap message enlarges temporarily)
let lastPinchTap = 0;
document.addEventListener('touchend', e => {
  if (!e.target.closest || !e.target.closest('.msgText')) return;
  const now = Date.now();
  if (now - lastPinchTap < 350) {
    const te = e.target.closest('.msgText');
    if (te.style.fontSize === '1.35em') {
      te.style.fontSize = '';
      te.style.transition = '';
    } else {
      te.style.transition = 'font-size .2s';
      te.style.fontSize = '1.35em';
      setTimeout(() => { te.style.fontSize = ''; }, 2500);
    }
  }
  lastPinchTap = now;
}, {passive:true});

renderTabs();
(async () => {
  try {
    const {user} = await api('/api/me');
    meUser = user;
    applyBubbleColor(user.chat_color || '');
    const params = new URLSearchParams(location.search);
    const chatParam = params.get('chat');
    if (chatParam) openChat(parseInt(chatParam));
    else switchTab('chats');
    updateBadge();
  } catch(e){
    view().innerHTML = `<div class="empty"><div class="t">Ошибка подключения</div><div class="d">${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
